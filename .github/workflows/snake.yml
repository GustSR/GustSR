name: snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gera a animação a partir do gráfico de contribuições
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # paleta alinhada ao banner: fundo #0a0c10, verde-água #2dd4bf
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%232dd4bf&color_dots=%2312262e,%23134e4a,%230f766e,%2314b8a6,%232dd4bf

      - name: Publica no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
